.form-switch .form-check-input:checked {

  padding: 0;

.form-range::-moz-range-track {

}

  height: 20px;

  &lt;main&gt;
    &lt;section class=&quot;section-panel is-active&quot; data-panel=&quot;overview&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;h2&gt;What we are building&lt;/h2&gt;
        &lt;p&gt;A repair-and-prevention layer for agent behavior. The trace explains an incident; the generated regression scenario is the durable artifact that prevents it from returning.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;section-stack&quot;&gt;
        &lt;div class=&quot;two-col&quot;&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;The problem&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;Prompt, model, schema, or policy edits can change behavior without breaking conventional unit tests.&lt;/li&gt;
              &lt;li&gt;Teams can inspect traces, but converting a failure into a stable behavioral test remains manual.&lt;/li&gt;
              &lt;li&gt;Unsafe tool calls, invalid arguments, loops, and approval bypasses need evidence—not guesswork.&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;The outcome&lt;/h3&gt;
            &lt;ol&gt;
              &lt;li&gt;Import a failed trace.&lt;/li&gt;
              &lt;li&gt;Identify the violated behavioral invariant.&lt;/li&gt;
              &lt;li&gt;Generate fixtures and deterministic assertions.&lt;/li&gt;
              &lt;li&gt;Review a bounded prompt, policy, schema, or routing patch.&lt;/li&gt;
              &lt;li&gt;Replay safely with mocked tools.&lt;/li&gt;
              &lt;li&gt;Add the verified scenario to CI.&lt;/li&gt;
            &lt;/ol&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout&quot;&gt;
          &lt;strong&gt;Product thesis&lt;/strong&gt;
          &lt;p&gt;Existing tools show what happened. TracePatch CI turns what happened into a tested repair and a permanent regression check.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;three-col&quot;&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;Authorization&lt;/h3&gt;
            &lt;p class=&quot;note&quot;&gt;Detect protected actions performed without a matching approval. Patch policy or instructions.&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;Tool contract&lt;/h3&gt;
            &lt;p class=&quot;note&quot;&gt;Detect invalid arguments, wrong ordering, or incompatible tool selection. Patch schema or preconditions.&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;Trajectory&lt;/h3&gt;
            &lt;p class=&quot;note&quot;&gt;Detect loops, premature completion, or incorrect routing. Patch instructions, termination, or routing.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;section-panel&quot; data-panel=&quot;workflow&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;h2&gt;Overall project workflow&lt;/h2&gt;
        &lt;p&gt;Two loops share the same scenario registry: incidents create tests, and pull requests continuously run those tests.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;section-stack&quot;&gt;
        &lt;div&gt;
          &lt;h3&gt;Incident repair loop&lt;/h3&gt;
          &lt;div class=&quot;workflow&quot; role=&quot;img&quot; aria-label=&quot;Import, normalize, diagnose, compile test, review patch, replay, compare, approve, save&quot;&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;1. Import&lt;/strong&gt;&lt;small&gt;Failed JSON trace&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;2. Normalize&lt;/strong&gt;&lt;small&gt;Validate and redact&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;3. Diagnose&lt;/strong&gt;&lt;small&gt;Cite failing spans&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;4. Compile test&lt;/strong&gt;&lt;small&gt;Fixtures + assertions&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;5. Review patch&lt;/strong&gt;&lt;small&gt;Human approval gate&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;6. Replay&lt;/strong&gt;&lt;small&gt;Mocked tools only&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;7. Compare&lt;/strong&gt;&lt;small&gt;Base vs candidate&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;8. Verify&lt;/strong&gt;&lt;small&gt;Deterministic pass/fail&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;9. Save&lt;/strong&gt;&lt;small&gt;Permanent scenario&lt;/small&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Continuous integration loop&lt;/h3&gt;
          &lt;div class=&quot;workflow ci-flow&quot; role=&quot;img&quot; aria-label=&quot;Detect changes, select scenarios, run base, run candidate, classify, report&quot;&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;1. Detect change&lt;/strong&gt;&lt;small&gt;Prompt/model/tool/policy&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;2. Select tests&lt;/strong&gt;&lt;small&gt;Relevant scenario pack&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;3. Run base&lt;/strong&gt;&lt;small&gt;Known behavior&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;4. Run candidate&lt;/strong&gt;&lt;small&gt;Proposed behavior&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;5. Classify&lt;/strong&gt;&lt;small&gt;Fixed, unchanged, regressed&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;flow-node&quot;&gt;&lt;strong&gt;6. Report&lt;/strong&gt;&lt;small&gt;PR-style evidence&lt;/small&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout&quot;&gt;
          &lt;strong&gt;Blocking rule&lt;/strong&gt;
          &lt;p&gt;Fail CI only when a blocking scenario passes on the base version and fails on the candidate. Infrastructure errors remain inconclusive rather than being misreported as regressions.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;section-panel&quot; data-panel=&quot;architecture&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;h2&gt;System architecture&lt;/h2&gt;
        &lt;p&gt;A single TypeScript application keeps deployment simple while preserving clean domain boundaries for later adapters and workers.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;section-stack&quot;&gt;
        &lt;div class=&quot;architecture&quot; role=&quot;img&quot; aria-label=&quot;Five-layer TracePatch architecture&quot;&gt;
          &lt;div class=&quot;arch-row&quot;&gt;
            &lt;div class=&quot;arch-label&quot;&gt;Experience&lt;/div&gt;
            &lt;div class=&quot;arch-items&quot;&gt;
              &lt;div class=&quot;arch-item&quot;&gt;&lt;strong&gt;Dashboard&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Status and incidents&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;arch-item&quot;&gt;&lt;strong&gt;Trace timeline&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Evidence navigation&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;arch-item&quot;&gt;&lt;strong&gt;Patch review&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Diff and approval&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;arch-item&quot;&gt;&lt;strong&gt;CI report&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Base/head result&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;arrow-down&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;arch-row&quot;&gt;
            &lt;div class=&quot;arch-label&quot;&gt;Application API&lt;/div&gt;
            &lt;div class=&quot;arch-items&quot;&gt;
              &lt;div class=&quot;arch-item&quot;&gt;Trace API&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Incident API&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Replay API&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Check API&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;arrow-down&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;arch-row&quot;&gt;
            &lt;div class=&quot;arch-label&quot;&gt;Core engine&lt;/div&gt;
            &lt;div class=&quot;arch-items&quot;&gt;
              &lt;div class=&quot;arch-item&quot;&gt;Normalizer + redactor&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Deterministic detectors&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Scenario compiler&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Patch agent&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Behavior comparator&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;arrow-down&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;arch-row&quot;&gt;
            &lt;div class=&quot;arch-label&quot;&gt;Execution&lt;/div&gt;
            &lt;div class=&quot;arch-items&quot;&gt;
              &lt;div class=&quot;arch-item&quot;&gt;&lt;strong&gt;GPT-5.6&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Diagnosis and bounded proposals&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;arch-item&quot;&gt;&lt;strong&gt;Replay runner&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Step and timeout limits&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;arch-item&quot;&gt;&lt;strong&gt;Mock registry&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;No external side effects&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;arrow-down&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;arch-row&quot;&gt;
            &lt;div class=&quot;arch-label&quot;&gt;Data + adapters&lt;/div&gt;
            &lt;div class=&quot;arch-items&quot;&gt;
              &lt;div class=&quot;arch-item&quot;&gt;SQLite metadata&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Versioned JSON scenarios&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Local Git adapter&lt;/div&gt;&lt;div class=&quot;arch-item&quot;&gt;Markdown artifacts&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;two-col&quot;&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;GPT-5.6 responsibilities&lt;/h3&gt;
            &lt;ul&gt;&lt;li&gt;Evidence-linked diagnosis&lt;/li&gt;&lt;li&gt;Scenario drafting&lt;/li&gt;&lt;li&gt;Bounded repair proposal&lt;/li&gt;&lt;li&gt;Human-readable behavioral explanation&lt;/li&gt;&lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;Deterministic responsibilities&lt;/h3&gt;
            &lt;ul&gt;&lt;li&gt;Schema and policy validation&lt;/li&gt;&lt;li&gt;Approval sequencing&lt;/li&gt;&lt;li&gt;Tool fixtures and assertions&lt;/li&gt;&lt;li&gt;Blocking CI conclusion&lt;/li&gt;&lt;/ul&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;section-panel&quot; data-panel=&quot;build&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;h2&gt;Three-phase incremental delivery roadmap&lt;/h2&gt;
        &lt;p&gt;Every phase ends with a working, tested artifact. Features advance only after the phase gate passes; the final phase freezes scope and focuses on reliability, recording, and submission.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;section-stack&quot;&gt;
        &lt;div class=&quot;delivery-phases&quot;&gt;
          &lt;article class=&quot;delivery-phase&quot;&gt;
            &lt;div class=&quot;phase-number&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;Phase 1&lt;/span&gt;&lt;strong&gt;MVP proof of concept&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;8 hours · Current next phase&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;phase-details&quot;&gt;
              &lt;h3&gt;Prove the central idea with one complete unsafe-refund path&lt;/h3&gt;
              &lt;div class=&quot;phase-columns&quot;&gt;
                &lt;div&gt;&lt;h3&gt;Build&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Scaffold TypeScript, tests, Zod, and seed data&lt;/li&gt;&lt;li&gt;Canonical trace schema and one failed trace&lt;/li&gt;&lt;li&gt;Seeded support agent and mocked tools&lt;/li&gt;&lt;li&gt;Authorization detector and approval assertion&lt;/li&gt;&lt;li&gt;Minimal original-versus-patched replay UI&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
                &lt;div&gt;&lt;h3&gt;Test first&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Schema rejection tests&lt;/li&gt;&lt;li&gt;Missing-approval detector test&lt;/li&gt;&lt;li&gt;Protected tool-order assertion test&lt;/li&gt;&lt;li&gt;Broken agent fails; safe agent passes&lt;/li&gt;&lt;li&gt;One end-to-end happy-path test&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
                &lt;div&gt;&lt;h3&gt;Phase gate&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Unsafe refund reproduced&lt;/li&gt;&lt;li&gt;Failure linked to trace evidence&lt;/li&gt;&lt;li&gt;Regression scenario runs independently&lt;/li&gt;&lt;li&gt;Candidate replay passes deterministically&lt;/li&gt;&lt;li&gt;No real external action occurs&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/article&gt;
          &lt;article class=&quot;delivery-phase&quot;&gt;
            &lt;div class=&quot;phase-number&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;Phase 2&lt;/span&gt;&lt;strong&gt;Enhanced working product&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;9 hours · Feature expansion&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;phase-details&quot;&gt;
              &lt;h3&gt;Add breadth, safety controls, CI comparison, and the full product experience&lt;/h3&gt;
              &lt;div class=&quot;phase-columns&quot;&gt;
                &lt;div&gt;&lt;h3&gt;Build&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Tool-contract and trajectory detectors&lt;/li&gt;&lt;li&gt;GPT-5.6 diagnosis and bounded patch agent&lt;/li&gt;&lt;li&gt;Editable scenario registry&lt;/li&gt;&lt;li&gt;Base-versus-candidate CI engine&lt;/li&gt;&lt;li&gt;Timeline, patch review, replay, and CI screens&lt;/li&gt;&lt;li&gt;Redaction, path allowlists, and audit records&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
                &lt;div&gt;&lt;h3&gt;Test first&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Detector test matrix for three categories&lt;/li&gt;&lt;li&gt;Unknown evidence citation rejection&lt;/li&gt;&lt;li&gt;Patch traversal and test-mutation rejection&lt;/li&gt;&lt;li&gt;CI classification truth table&lt;/li&gt;&lt;li&gt;Model/API failure fallback tests&lt;/li&gt;&lt;li&gt;Integration tests across the two product loops&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
                &lt;div&gt;&lt;h3&gt;Phase gate&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;All three seeded incidents diagnose correctly&lt;/li&gt;&lt;li&gt;Scenario export and re-import succeeds&lt;/li&gt;&lt;li&gt;New regression fails CI&lt;/li&gt;&lt;li&gt;Existing failure is not mislabeled as new&lt;/li&gt;&lt;li&gt;Human approval precedes candidate creation&lt;/li&gt;&lt;li&gt;All automated tests remain green&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/article&gt;
          &lt;article class=&quot;delivery-phase&quot;&gt;
            &lt;div class=&quot;phase-number&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;Phase 3&lt;/span&gt;&lt;strong&gt;Release and submission&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;5 hours + 2–4 hour buffer&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;phase-details&quot;&gt;
              &lt;h3&gt;Freeze features, validate reliability, package evidence, record, and submit&lt;/h3&gt;
              &lt;div class=&quot;phase-columns&quot;&gt;
                &lt;div&gt;&lt;h3&gt;Finalize&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Fix defects; add no discretionary features&lt;/li&gt;&lt;li&gt;Loading, empty, timeout, and error states&lt;/li&gt;&lt;li&gt;README, architecture, setup, and limitations&lt;/li&gt;&lt;li&gt;Hosted or one-command judge experience&lt;/li&gt;&lt;li&gt;Fallback traces and replay artifacts&lt;/li&gt;&lt;li&gt;Public demo recording and submission form&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
                &lt;div&gt;&lt;h3&gt;Final testing&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Unit, integration, and end-to-end suite&lt;/li&gt;&lt;li&gt;Clean-clone installation test&lt;/li&gt;&lt;li&gt;Two consecutive full demo rehearsals&lt;/li&gt;&lt;li&gt;Responsive and keyboard-accessibility checks&lt;/li&gt;&lt;li&gt;Secret/redaction and no-side-effect review&lt;/li&gt;&lt;li&gt;Submission links and permissions verification&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
                &lt;div&gt;&lt;h3&gt;Release gate&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Primary demo completes reliably&lt;/li&gt;&lt;li&gt;Tests, type check, and lint pass&lt;/li&gt;&lt;li&gt;Judge instructions work from scratch&lt;/li&gt;&lt;li&gt;Video is public, audible, and under 3 minutes&lt;/li&gt;&lt;li&gt;README explains Codex and GPT-5.6 roles&lt;/li&gt;&lt;li&gt;Repository and session ID are submitted&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/article&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Test-driven development loop used in every phase&lt;/h3&gt;
          &lt;div class=&quot;tdd-loop&quot; role=&quot;img&quot; aria-label=&quot;Write failing test, implement minimum, run tests, refactor, commit green state&quot;&gt;
            &lt;div class=&quot;tdd-step&quot;&gt;&lt;strong&gt;1. Red&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Write the failing behavior test&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;tdd-step&quot;&gt;&lt;strong&gt;2. Green&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Implement the smallest passing change&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;tdd-step&quot;&gt;&lt;strong&gt;3. Verify&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Run focused and regression tests&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;tdd-step&quot;&gt;&lt;strong&gt;4. Refactor&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Improve structure without changing behavior&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;tdd-step&quot;&gt;&lt;strong&gt;5. Record&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Commit only green work and update journal&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;strong&gt;Focused effort allocation: 8 hours MVP + 9 hours enhancement + 5 hours finalization + 2–4 hour contingency&lt;/strong&gt;
          &lt;div class=&quot;timebar&quot; aria-label=&quot;Eight MVP hours, nine enhancement hours, five finalization hours, and four contingency hours&quot;&gt;
            &lt;span class=&quot;time-segment d1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d1&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d2&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;time-segment d3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment d3&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;time-segment buffer&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment buffer&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment buffer&quot;&gt;&lt;/span&gt;&lt;span class=&quot;time-segment buffer&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;legend text-small&quot;&gt;&lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;legend-swatch&quot;&gt;&lt;/span&gt;Phase 1: MVP&lt;/span&gt;&lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;legend-swatch d2&quot;&gt;&lt;/span&gt;Phase 2: enhanced product&lt;/span&gt;&lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;legend-swatch d3&quot;&gt;&lt;/span&gt;Phase 3: release&lt;/span&gt;&lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;legend-swatch buffer&quot;&gt;&lt;/span&gt;Contingency&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout&quot;&gt;
          &lt;strong&gt;Incremental delivery rule&lt;/strong&gt;
          &lt;p&gt;Do not start Phase 2 until the MVP gate passes. Do not add features in Phase 3. If time runs short, submit the tested Phase 1 proof of concept with clear limitations rather than an unstable partial Phase 2.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;section-panel&quot; data-panel=&quot;decisions&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;h2&gt;Design choices with explicit justification&lt;/h2&gt;
        &lt;p&gt;Each choice reduces a specific implementation or trust risk while keeping the core agentic value visible.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;decision-list&quot;&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;One TypeScript application&lt;/strong&gt;&lt;span&gt;Next.js UI and API with shared domain types.&lt;/span&gt;&lt;span&gt;Minimizes deployment and serialization complexity while allowing clean module boundaries.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;Canonical JSON trace first&lt;/strong&gt;&lt;span&gt;One validated internal trace/span schema.&lt;/span&gt;&lt;span&gt;Prevents adapter work from consuming the deadline; OpenAI and OpenTelemetry adapters remain an expansion path.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;Deterministic checks block CI&lt;/strong&gt;&lt;span&gt;Policy, schema, ordering, approval, loop, and termination assertions.&lt;/span&gt;&lt;span&gt;A model-only judge can be inconsistent. Blocking decisions need repeatable, inspectable evidence.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;GPT-5.6 for semantic work&lt;/strong&gt;&lt;span&gt;Diagnosis, test drafting, patch proposal, and explanation.&lt;/span&gt;&lt;span&gt;Uses the model where interpretation adds value without granting it unchecked authority over safety outcomes.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;Mocked tools during replay&lt;/strong&gt;&lt;span&gt;Recorded deterministic responses; state-changing calls are simulated.&lt;/span&gt;&lt;span&gt;Guarantees repeatability and prevents refunds, messages, or other external side effects during testing.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;Human-approved bounded patches&lt;/strong&gt;&lt;span&gt;Only instructions, policies, schemas, and routing are writable.&lt;/span&gt;&lt;span&gt;Keeps the demo trustworthy, makes the change visible, and avoids arbitrary repository modification.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;SQLite + versioned scenario files&lt;/strong&gt;&lt;span&gt;SQLite stores run metadata; JSON fixtures remain reviewable in source control.&lt;/span&gt;&lt;span&gt;Combines simple local persistence with transparent, durable CI artifacts.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;Local PR simulator first&lt;/strong&gt;&lt;span&gt;Git base/head comparison and Markdown report without GitHub credentials.&lt;/span&gt;&lt;span&gt;Protects the demo from OAuth, webhook, network, and permissions failures; a GitHub adapter can reuse the same result.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;decision&quot;&gt;&lt;strong&gt;Refund approval as hero story&lt;/strong&gt;&lt;span&gt;₹18,000 refund must be approved before execution.&lt;/span&gt;&lt;span&gt;It is immediately understandable, visibly high stakes, and supports deterministic ordering assertions.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;section-panel&quot; data-panel=&quot;scope&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;h2&gt;MVP scope, screens, and demonstration&lt;/h2&gt;
        &lt;p&gt;One excellent vertical slice is more valuable than broad integrations that cannot be demonstrated reliably.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;section-stack&quot;&gt;
        &lt;div class=&quot;two-col&quot;&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;P0 capabilities&lt;/h3&gt;
            &lt;ul class=&quot;checklist&quot;&gt;
              &lt;li&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Seeded support agent with lookup, refund preview, approval, and refund tools&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Three failed traces covering authorization, tool contract, and trajectory&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Evidence-linked diagnosis and generated test&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Bounded prompt/policy/schema patch with approval&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Safe base-versus-candidate replay&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Local CI result and Markdown export&lt;/span&gt;&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;plain-group&quot;&gt;
            &lt;h3&gt;Not in the first build&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;Real production tool execution&lt;/li&gt;
              &lt;li&gt;Universal trace-vendor support&lt;/li&gt;
              &lt;li&gt;Autonomous commits or merges&lt;/li&gt;
              &lt;li&gt;Formal compliance claims&lt;/li&gt;
              &lt;li&gt;Large-scale production clustering&lt;/li&gt;
              &lt;li&gt;Full multi-agent handoff repair&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Six product sections and their main steps&lt;/h3&gt;
          &lt;div class=&quot;table-responsive&quot;&gt;
            &lt;table class=&quot;table table-sm&quot;&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Main steps&lt;/th&gt;&lt;th&gt;Visible output&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;Dashboard&lt;/td&gt;&lt;td&gt;Select incident → inspect check status&lt;/td&gt;&lt;td&gt;Current incidents and latest CI result&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;Trace timeline&lt;/td&gt;&lt;td&gt;Validate → redact → render → highlight evidence&lt;/td&gt;&lt;td&gt;Unsafe tool span and missing approval&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;Diagnosis&lt;/td&gt;&lt;td&gt;Run detectors → ask GPT-5.6 → validate citations&lt;/td&gt;&lt;td&gt;Actual vs expected behavior&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;Generated test&lt;/td&gt;&lt;td&gt;Minimize input → mock tools → define assertions → approve&lt;/td&gt;&lt;td&gt;Reusable scenario JSON&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;Patch + replay&lt;/td&gt;&lt;td&gt;Generate diff → review → approve → run candidate → compare&lt;/td&gt;&lt;td&gt;Red original path and green repaired path&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;CI check&lt;/td&gt;&lt;td&gt;Resolve base/head → select pack → replay both → classify → report&lt;/td&gt;&lt;td&gt;Pass/fail Markdown evidence&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout&quot;&gt;
          &lt;strong&gt;Three-minute demo arc&lt;/strong&gt;

  &lt;script&gt;
    (() =&gt; {

      if (!root) return;
      const buttons = Array.from(root.querySelectorAll(&#x27;[data-section]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;[data-panel]&#x27;));
      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = button.getAttribute(&#x27;data-section&#x27;);
          buttons.forEach((item) =&gt; {

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
